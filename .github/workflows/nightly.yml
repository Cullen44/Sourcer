name: Nightly

# 08:15 UTC is after midnight Pacific (PDT and PST), when the YouTube quota
# resets. Started by Supabase pg_cron (supabase/scheduler.sql); the schedule
# below is a backup. Disabled until POLLER_ENABLED is "true".
#   1. apply any pending database migrations, seed competitors from config
#   2. YouTube competitor search / discovery / vetting / refresh (each capped
#      to its share of the daily quota)
# Schedules run as whoever last changed this file's schedule; commits must be
# attributed to the repo owner (not a bot account) or GitHub creates no runs.
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: ${{ vars.POLLER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run competitors:seed
      - run: npm run daily
